# Render Blueprint for Memory Lane FastAPI Backend
# Deploy frontend separately on Vercel (Root Directory: frontend)
services:
  - type: web
    name: memory-lane-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: NEON_AUTH_ENABLED
        value: "true"
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET_ORIGINALS
        value: assets
      - key: S3_BUCKET_DERIVATIVES
        value: assets
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-2
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_TEXT_MODEL
        value: deepseek/deepseek-v4.1-flash
      - key: OPENROUTER_VISION_MODEL
        value: deepseek/deepseek-v4.1-flash
      - key: OPENROUTER_TRANSCRIPTION_MODEL
        value: google/gemini-2.5-flash-lite
      - key: OPENROUTER_IMAGE_MODEL
        value: google/gemini-3.1-flash-image
      - key: OPENROUTER_VIDEO_MODEL
        value: google/gemini-omni-1.2-flash
      - key: FRONTEND_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
