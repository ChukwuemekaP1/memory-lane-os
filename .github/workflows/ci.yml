name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: memorylane
          POSTGRES_PASSWORD: memorylane
          POSTGRES_DB: memorylane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memorylane"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://memorylane:memorylane@127.0.0.1:5432/memorylane_test
      TEST_DATABASE_URL: postgresql+asyncpg://memorylane:memorylane@127.0.0.1:5432/memorylane_test
      REDIS_URL: redis://127.0.0.1:6379/0
      MAIL_DRIVER: memory
      STORAGE_DRIVER: filesystem
      JOBS_DRIVER: memory
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Install FFmpeg (media processing tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app alembic tests
      - name: Typecheck (mypy)
        working-directory: backend
        run: mypy app
      - name: Migrate (online check)
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Test (pytest)
        working-directory: backend
        run: python -m pytest tests/ --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install frontend
        working-directory: frontend
        # NOTE: switch to `npm ci` once package-lock.json is committed by a
        # networked run (see docs/DEVELOPMENT.md).
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests (vitest)
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Smoke tests (playwright)
        working-directory: frontend
        run: npm run playwright

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build api worker web
